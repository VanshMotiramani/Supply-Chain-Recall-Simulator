[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain"
version = "0.1.0"
description = "YottaFlex AI Supply-Chain Traceability & Recall Simulation"
requires-python = ">=3.11"
dependencies = [
    "faker>=26.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
supply-chain = "supply_chain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
